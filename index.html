<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сдвиг — что меняется в аналитике</title>
<meta name="description" content="Еженедельный выпуск для продуктовых и BI-аналитиков: AI-агенты, новые инструменты и практики, которые можно попробовать на этой неделе.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f45e6'/%3E%3Cpath d='M7 22h7v-6H7zm11 0h7V9h-7z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f8; --surface:#ffffff; --ink:#18203a; --muted:#5d6680; --line:#dfe2ea;
  --accent:#2f45e6; --accent-ink:#ffffff;
  --try:#0b8a5c; --try-bg:#e3f4ec; --watch:#a86a00; --watch-bg:#fbf0d9; --skip:#6b7387; --skip-bg:#eceef3;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11152a; --surface:#181d36; --ink:#eef0f7; --muted:#9aa2bd; --line:#2a3152;
    --accent:#6f80ff; --accent-ink:#0d1124;
    --try:#4fd29a; --try-bg:#173a30; --watch:#f0b54a; --watch-bg:#3a2f17; --skip:#9aa2bd; --skip-bg:#252b47;
  }
}
:root[data-theme="dark"]{
  --bg:#11152a; --surface:#181d36; --ink:#eef0f7; --muted:#9aa2bd; --line:#2a3152;
  --accent:#6f80ff; --accent-ink:#0d1124;
  --try:#4fd29a; --try-bg:#173a30; --watch:#f0b54a; --watch-bg:#3a2f17; --skip:#9aa2bd; --skip-bg:#252b47;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Onest",system-ui,sans-serif}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 32px}

/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.03em;text-decoration:none}
.logo svg{width:28px;height:28px}
.top nav{display:flex;gap:22px;font-size:15px;color:var(--muted)}
.top nav a{text-decoration:none}
.top nav a:hover{color:var(--ink)}

/* герой: главный сдвиг недели */
.hero{padding:56px 0 64px;border-bottom:1px solid var(--line)}
.issue-line{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:15px;margin-bottom:28px}
.issue-line b{color:var(--ink);font-weight:600}
.shift{font-weight:800;font-size:clamp(36px,6vw,72px);line-height:1.02;letter-spacing:-.045em;margin:0;max-width:16ch;text-wrap:balance}
.shift-bar{display:block;width:96px;height:10px;background:var(--accent);border-radius:5px;margin:0 0 30px;transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(.15)}to{transform:scaleX(1)}}
.lead{font-size:20px;line-height:1.5;color:var(--muted);max-width:60ch;margin:28px 0 0}

/* легенда вердиктов */
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:40px 0 8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;padding:5px 11px 5px 9px;border-radius:999px;white-space:nowrap}
.chip:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.try{color:var(--try);background:var(--try-bg)}
.chip.watch{color:var(--watch);background:var(--watch-bg)}
.chip.skip{color:var(--skip);background:var(--skip-bg)}

/* лента новостей */
h2.sec{font-size:28px;letter-spacing:-.03em;line-height:1.15;margin:64px 0 8px;font-weight:800}
.sec-note{color:var(--muted);margin:0 0 20px;font-size:16px}
.feed{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:170px minmax(0,1fr);gap:28px;padding:30px 0;border-top:1px solid var(--line)}
.item:last-child{border-bottom:1px solid var(--line)}
.item-side{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.area{font-size:14px;color:var(--muted)}
.item h3{font-size:24px;line-height:1.22;letter-spacing:-.025em;margin:0 0 12px;font-weight:600;max-width:34ch}
.what{margin:0;color:var(--muted);max-width:66ch}
.use{margin:16px 0 0;padding:14px 18px;background:var(--surface);border-radius:12px;max-width:66ch;border:1px solid var(--line)}
.use b{display:block;font-size:14px;color:var(--accent);margin-bottom:2px;font-weight:600}
.src{display:inline-block;margin-top:12px;font-size:14px;color:var(--muted);text-underline-offset:3px}
.src:hover{color:var(--ink)}

/* практика + коротко */
.lower{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;margin:64px 0 0;align-items:start}
.practice{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:34px}
.practice .k{font-size:15px;opacity:.85;margin:0 0 10px}
.practice h2{font-size:32px;line-height:1.1;letter-spacing:-.035em;margin:0 0 6px;font-weight:800}
.practice .time{font-size:15px;opacity:.85;margin:0 0 22px}
.practice ol{margin:0;padding:0;list-style:none;counter-reset:s}
.practice li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid color-mix(in srgb,var(--accent-ink) 25%,transparent)}
.practice li:before{content:counter(s);font-weight:800;font-size:20px;line-height:1.3}
.practice .result{margin:18px 0 0;font-size:16px;opacity:.92}
.brief h2{font-size:24px;letter-spacing:-.025em;margin:6px 0 14px;font-weight:800}
.brief ul{list-style:none;margin:0;padding:0}
.brief li{padding:14px 0;border-top:1px solid var(--line);font-size:16px}
.brief li a{text-decoration:none}
.brief li a:hover span{text-decoration:underline;text-underline-offset:3px}

/* архив и подвал */
.archive{margin:72px 0 0;padding:28px 0;border-top:1px solid var(--line)}
.archive h2{font-size:20px;margin:0 0 12px;font-weight:600}
.archive ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.archive a{display:inline-block;padding:7px 13px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:15px;background:var(--surface)}
.archive a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
footer{padding:20px 0 48px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:820px){
  .wrap{padding:0 16px}
  .hero{padding:32px 0 44px}
  .lead{font-size:18px}
  .item{grid-template-columns:1fr;gap:12px;padding:24px 0}
  .item-side{flex-direction:row;align-items:center;gap:12px}
  .item h3{font-size:21px}
  .lower{grid-template-columns:1fr;gap:40px}
  .practice{padding:26px 22px;border-radius:18px}
  .top nav a.hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){.shift-bar{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="./" aria-label="Сдвиг, последний выпуск">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M7 22h7v-6H7zm11 0h7V9h-7z" fill="var(--accent-ink)"/></svg>
      сдвиг
    </a>
    <nav aria-label="Разделы">
      <a href="#feed">Главное</a>
      <a href="#practice">Практика</a>
      <a href="#archive" class="hide-sm">Архив</a>
    </nav>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer>
    <span>Сдвиг выходит по понедельникам. Для продуктовых и BI-аналитиков.</span>
    <span>Вердикт в каждой новости: пробовать, следить или пропустить.</span>
  </footer>
</div>

<script src="issues.js"></script>
<script>
(function(){
  var issues = window.SDVIG_ISSUES || [];
  var app = document.getElementById('app');
  var V = {try:'Пробовать', watch:'Следить', skip:'Пропустить'};
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  if(!issues.length){app.innerHTML='<section class="hero"><p class="lead">Первый выпуск выйдет в понедельник.</p></section>';return}

  var wanted = new URLSearchParams(location.search).get('issue');
  var issue = issues.filter(function(i){return i.id===wanted})[0] || issues[0];
  var isLatest = issue === issues[0];
  document.title = 'Сдвиг №' + issue.number + ' — ' + issue.date;

  var html = '';
  html += '<section class="hero">'
    + '<div class="issue-line"><span><b>Выпуск №'+issue.number+'</b></span><span>'+esc(issue.date)+'</span><span>Период: '+esc(issue.period)+'</span>'
    + (isLatest?'':'<a href="./">К последнему выпуску</a>') + '</div>'
    + '<span class="shift-bar" aria-hidden="true"></span>'
    + '<h1 class="shift">'+esc(issue.shift)+'</h1>'
    + '<p class="lead">'+esc(issue.lead)+'</p>'
    + '</section>';

  html += '<section id="feed" aria-labelledby="feed-h"><h2 class="sec" id="feed-h">Главное за неделю</h2>'
    + '<p class="sec-note">'+issue.items.length+' новостей. В каждой сказано, что с ней делать в работе.</p>'
    + '<div class="legend" aria-label="Обозначения"><span class="chip try">Пробовать</span><span class="chip watch">Следить</span><span class="chip skip">Пропустить</span></div>'
    + '<ul class="feed">';
  issue.items.forEach(function(it){
    html += '<li class="item"><div class="item-side"><span class="chip '+it.verdict+'">'+V[it.verdict]+'</span><span class="area">'+esc(it.area)+'</span></div>'
      + '<div><h3>'+esc(it.title)+'</h3><p class="what">'+esc(it.what)+'</p>'
      + '<p class="use"><b>Как применить</b>'+esc(it.use)+'</p>'
      + (it.source?'<a class="src" href="'+esc(it.source.url)+'" target="_blank" rel="noopener">Источник: '+esc(it.source.label)+'</a>':'')
      + '</div></li>';
  });
  html += '</ul></section>';

  var p = issue.practice;
  html += '<div class="lower">';
  if(p){
    html += '<section class="practice" id="practice" aria-labelledby="pr-h"><p class="k">Практика недели</p><h2 id="pr-h">'+esc(p.title)+'</h2><p class="time">'+esc(p.time)+'</p><ol>'
      + p.steps.map(function(s){return '<li><span>'+esc(s)+'</span></li>'}).join('')
      + '</ol><p class="result">'+esc(p.result)+'</p></section>';
  }
  if(issue.brief && issue.brief.length){
    html += '<section class="brief" aria-labelledby="br-h"><h2 id="br-h">Коротко</h2><ul>'
      + issue.brief.map(function(b){return '<li>'+(b.url?'<a href="'+esc(b.url)+'" target="_blank" rel="noopener"><span>'+esc(b.text)+'</span></a>':esc(b.text))+'</li>'}).join('')
      + '</ul></section>';
  }
  html += '</div>';

  html += '<section class="archive" id="archive" aria-labelledby="ar-h"><h2 id="ar-h">Архив выпусков</h2><ul>'
    + issues.map(function(i){return '<li><a href="?issue='+esc(i.id)+'"'+(i===issue?' aria-current="page"':'')+'>№'+i.number+', '+esc(i.date)+'</a></li>'}).join('')
    + '</ul></section>';

  app.innerHTML = html;
})();
</script>
</body>
</html>
